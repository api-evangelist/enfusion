name: Enfusion
description: 'Enfusion is a cloud-native, front-to-back investment management platform for hedge funds
  and asset managers, unifying portfolio management (PMS), order and execution management (OEMS), pre-
  and post-trade compliance, a unified IBOR/ABOR accounting book of record, and analytics on a single
  SaaS database. It serves over 1,000 clients across 30 countries, offers direct connectivity to 300+
  liquidity sources via FIX, and maintains a 4M+ instrument security master. Enfusion was acquired by
  Clearwater Analytics (CWAN) in 2025; the enfusion.com domain now redirects to cwan.com, where Enfusion
  is offered as a product line. There is no public developer portal or open API specification: the platform
  API and knowledge base are gated behind the client web application and Zendesk help center. This profile
  was surfaced as an ICONIQ Capital portfolio lead and enriched from public marketing, support, and legal
  surfaces.'
